<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách sản phẩm</title>
</head>
<body>
    <h1>Danh sách sản phẩm</h1>
    <table border="1">
        <thead>
            <tr>
                <th>Tên sản phẩm</th>
                <th>Giá</th>
                <th>Số lượng</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Bàn phím</td>
                <td>450.000 VNĐ</td>
                <td>12</td>
            </tr>
            <tr>
                <td>Chuột không dây</td>
                <td>250.000 VNĐ</td>
                <td>20</td>
            </tr>
            <tr>
                <td>Tai nghe</td>
                <td>690.000 VNĐ</td>
                <td>8</td>
            </tr>
            <tr>
                <td>Màn hình</td>
                <td>3.500.000 VNĐ</td>
                <td>5</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
