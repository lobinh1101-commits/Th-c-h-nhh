<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khảo sát khách hàng</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px 16px;
            background: #f3f5f8;
            font-family: Arial, Helvetica, sans-serif;
        }

        main {
            width: min(100%, 820px);
            margin: 0 auto;
            overflow: hidden;
            border: 1px solid #e1e5ea;
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 6px 24px rgb(24 39 56 / 8%);
        }

        iframe {
            display: block;
            width: 100%;
            height: 1220px;
            border: 0;
        }

        @media (max-width: 600px) {
            body {
                padding: 0;
            }

            main {
                border: 0;
                border-radius: 0;
                box-shadow: none;
            }

            iframe {
                height: 1500px;
            }
        }
    </style>
</head>
<body>
    <main>
        <iframe
            title="Khảo sát nghiên cứu thị trường"
            src="https://gallery.wufoo.com/forms/?formname=pyej3161l9pt0d&amp;embed=1&amp;embedKey=pyej3161l9pt0d89279"
            loading="lazy">
            <p>Trình duyệt của bạn không hỗ trợ nội dung nhúng.
                <a href="https://gallery.wufoo.com/embed/pyej3161l9pt0d/def/embedKey=pyej3161l9pt0d89279">
                    Mở khảo sát khách hàng
                </a>.
            </p>
        </iframe>
    </main>
</body>
</html>
