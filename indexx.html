<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài viết của tôi</title>
    <style>
        body {
            margin: 0;
            padding: 40px 52px;
            background-color: #f3f3f3;
            color: #1f1f1f;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 30px;
            line-height: 1.6;
        }

        h1 {
            margin: 0 0 20px;
            font-size: 42px;
            font-weight: 700;
            color: #1f1f1f;
            background-color: #fff;
            display: inline-block;
        }

        p {
            margin: 0 0 18px;
            font-size: 30px;
            line-height: 1.6;
        }

        .red {
            color: #d32f2f;
            font-weight: bold;
        }

        .italic {
            font-style: italic;
        }

        .center {
            text-align: center;
        }

        .big {
            font-size: 32px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <h1>Bài viết của tôi</h1>

    <p><span class="red">Đây là đoạn văn</span> được định dạng màu sắc.</p>

    <p class="italic">Tôi đang học HTML Styles.</p>

    <p class="center big">Định dạng văn bản giúp trang web đẹp hơn.</p>
</body>
</html>
