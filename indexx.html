<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô tả</title>
    <style>
        body {
            margin: 0;
            padding: 40px 48px;
            background-color: #f2f2f2;
            color: #1f1f1f;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 30px;
            line-height: 1.6;
        }

        h1 {
            margin: 0 0 18px;
            font-size: 40px;
            font-weight: 700;
        }

        ol, ul {
            margin: 0;
            padding-left: 52px;
        }

        li {
            margin: 18px 0;
        }

        code {
            display: inline-block;
            background: #d9d9d9;
            border-radius: 6px;
            padding: 2px 10px;
            font-family: Consolas, "Courier New", monospace;
            font-size: 0.9em;
            vertical-align: middle;
        }

        .sub-list {
            list-style-type: disc;
            padding-left: 56px;
            margin-top: 10px;
        }

        .sub-list li {
            margin: 12px 0;
        }
    </style>
</head>
<body>
    <h1>Mô tả:</h1>

    <ol>
        <li>Tạo một file mới có tên <code>index.html</code>.</li>
        <li>Thêm vào trong thẻ <code>&lt;body&gt;</code> các phần sau:</li>
    </ol>

    <ul class="sub-list">
        <li <code>&lt;h1&gt;</code>, nội dung: "Chào mừng đến với trang web của tôi".</li>
        <li><code>&lt;h2&gt;</code>, nội dung: "Giới thiệu bản thân".</li>
        <li><code>&lt;p&gt;</code> tôi thích lập trình.</li>
        <li><code>&lt;p&gt;</code> tôi là lập trình viên.</li>
    </ul>
</body>
</html>
